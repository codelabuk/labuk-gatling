apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "perf-dashboard.fullname" . }}
  labels:
    {{- include "perf-dashboard.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "perf-dashboard.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "perf-dashboard.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "perf-dashboard.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: dashboard
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: WATCH_NAMESPACES
              value: {{ join "," .Values.watchNamespaces | quote }}
            - name: RESULTS_URL
              value: {{ .Values.results.url | quote }}
            - name: PLANS_URL
              value: {{ .Values.results.plansUrl | quote }}
            - name: S3_ENDPOINT
              value: {{ .Values.results.s3Endpoint | quote }}
            - name: AWS_REGION
              value: {{ .Values.results.region | quote }}
            - name: DEFAULT_IMAGE
              value: {{ .Values.runDefaults.image | quote }}
            - name: DEFAULT_S3_SECRET
              value: {{ .Values.runDefaults.s3CredentialsSecret | quote }}
            - name: DEFAULT_RUN_S3_ENDPOINT
              value: {{ .Values.runDefaults.s3Endpoint | quote }}
          envFrom:
            - secretRef:
                name: {{ .Values.results.credentialsSecret }}
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 30
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "perf-dashboard.fullname" . }}
  labels:
    {{- include "perf-dashboard.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "perf-dashboard.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "perf-dashboard.fullname" . }}
  labels:
    {{- include "perf-dashboard.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tlsSecretName }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tlsSecretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "perf-dashboard.fullname" . }}
                port:
                  name: http
{{- end }}
