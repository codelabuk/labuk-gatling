{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "perf-dashboard.serviceAccountName" . }}
  labels:
    {{- include "perf-dashboard.labels" . | nindent 4 }}
---
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "perf-dashboard.fullname" . }}
  labels:
    {{- include "perf-dashboard.labels" . | nindent 4 }}
rules:
  - apiGroups: ["perf.codelabuk.org"]
    resources: ["loadtests"]
    verbs: ["get", "list", "watch", "create", "delete"]   # create = "New run", delete = stop/delete a run
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "perf-dashboard.fullname" . }}
  labels:
    {{- include "perf-dashboard.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "perf-dashboard.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "perf-dashboard.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
