{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "loadtest-operator.serviceAccountName" . }}
  labels:
    {{- include "loadtest-operator.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if .Values.rbac.create }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "loadtest-operator.fullname" . }}
  labels:
    {{- include "loadtest-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: ["perf.codelabuk.org"]
    resources: ["loadtests"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["perf.codelabuk.org"]
    resources: ["loadtests/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods"]          # read the validate/report pods' results (termination messages)
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "loadtest-operator.fullname" . }}
  labels:
    {{- include "loadtest-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "loadtest-operator.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "loadtest-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
