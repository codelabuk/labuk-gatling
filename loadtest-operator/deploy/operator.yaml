# loadtest-operator: namespace, permissions and the operator itself.
#   1. kubectl apply -f loadtest-operator/target/classes/META-INF/fabric8/loadtests.perf.codelabuk.org-v1.yml   (the CRD, generated by mvn package)
#   2. kubectl apply -f loadtest-operator/deploy/operator.yaml
# The operator watches LoadTest resources in all namespaces and creates Jobs/pods next to them.
apiVersion: v1
kind: Namespace
metadata:
  name: perf-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: loadtest-operator
  namespace: perf-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: loadtest-operator
rules:
  - apiGroups: ["perf.codelabuk.org"]
    resources: ["loadtests"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["perf.codelabuk.org"]
    resources: ["loadtests/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods"]          # read the validate/report pods' results (termination messages)
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: loadtest-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: loadtest-operator
subjects:
  - kind: ServiceAccount
    name: loadtest-operator
    namespace: perf-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadtest-operator
  namespace: perf-system
  labels: { app: loadtest-operator }
spec:
  replicas: 1                    # single instance: the operator keeps no state outside LoadTest.status
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: loadtest-operator }
  template:
    metadata:
      labels: { app: loadtest-operator }
    spec:
      serviceAccountName: loadtest-operator
      securityContext: { runAsNonRoot: true, runAsUser: 1000 }
      containers:
        - name: operator
          image: labuk-loadtest-operator:1.0-SNAPSHOT     # mvn -pl loadtest-operator -am package jib:build -Dimage=<registry>/labuk-loadtest-operator
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
